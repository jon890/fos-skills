name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq zsh
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.309
      - name: Run plugin tests from repository root
        run: claude plugin test .
      - name: Run repository test runner
        # 묶음 목록, TypeScript 버전, 캐시 폴더는 실행기가 소유한다(scripts/run-tests.ts 머리 주석)
        run: node scripts/run-tests.ts
