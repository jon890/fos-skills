name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.309
      - name: Run plugin tests from repository root
        run: claude plugin test .
      - name: Run orch and work-board node tests
        # 명령마다 .ts 를 다시 컴파일하지 않게 캐시를 둔다. Node 24 부터 타입을 제거한 .ts 에 듣는다(docs/adr/011-node-24-minimum.md)
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: node --test --test-concurrency=4 "orch/tests/*.spec.ts" "work-board/tests/*.spec.ts"

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq zsh
      - name: Run Python suites including korean-check
        shell: bash
        run: |
          for suite in */tests tools/*/tests; do
            # orch 와 work-board 의 테스트는 node:test 라 Plugin tests job 이 돌린다.
            # 두 폴더에 Python 테스트가 없고, 빈 폴더에서 unittest 는 종료 코드 5 로 실패한다
            if [[ "$suite" == "orch/tests" || "$suite" == "work-board/tests" ]]; then
              continue
            fi
            echo "Testing $suite"
            python3 -m unittest discover -s "$suite"
          done
