name: ci-speed-experiment
# 임시 측정용이다. PR 전에 지운다.
on:
  push:
    branches: [perf/ci-test-speed]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        concurrency: [4, 6, 8]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - run: npm ci --ignore-scripts
      - name: machine
        run: |
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'; free -g
      - name: run
        run: |
          vmstat 5 > "$RUNNER_TEMP/vmstat.txt" &
          /usr/bin/time -v node scripts/run-tests.ts --concurrency ${{ matrix.concurrency }} --out "$RUNNER_TEMP/run-tests" 2> "$RUNNER_TEMP/time.txt" || true
          kill %1 || true
          tail -1 "$RUNNER_TEMP/run-tests/summary.txt"
          grep -E 'Elapsed|User time|System time|Percent of CPU' "$RUNNER_TEMP/time.txt"
          awk 'NR>2 {us+=$13; sy+=$14; id+=$15; wa+=$16; r+=$1; n++} END {printf "vmstat avg us=%.0f sy=%.0f id=%.0f wa=%.0f runq=%.1f n=%d\n", us/n, sy/n, id/n, wa/n, r/n, n}' "$RUNNER_TEMP/vmstat.txt"
          grep '^실패' "$RUNNER_TEMP/run-tests/summary.txt" | head -20 || true
