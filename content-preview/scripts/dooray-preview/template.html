<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Dooray 미리보기 — {{TITLE}}</title>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.css" />
<style>
  body {
    margin: 0;
    background: #f1f3f5;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, sans-serif;
  }
  .dooray-frame {
    max-width: 860px;
    margin: 32px auto;
    background: #fff;
    border: 1px solid #e0e2e5;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    overflow: hidden;
  }
  .dooray-head {
    padding: 24px 32px 16px;
    border-bottom: 1px solid #eceef0;
  }
  .dooray-proj { font-size: 12px; color: #888; margin-bottom: 6px; }
  .dooray-title { font-size: 20px; font-weight: 700; color: #222; line-height: 1.4; }
  .dooray-meta { margin-top: 12px; font-size: 12px; color: #666; display: flex; gap: 16px; flex-wrap: wrap; }
  .dooray-meta b { color: #333; font-weight: 600; }
  .tags { margin-top: 10px; }
  /* 댓글 모드 — 업무 본문이 아니라 댓글로 등록하는 본문의 머리다. */
  .dooray-comment-head {
    padding: 20px 32px 14px;
    border-bottom: 1px solid #eceef0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dooray-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3565c0;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .dooray-author { font-size: 14px; font-weight: 600; color: #222; }
  .dooray-on { font-size: 12px; color: #888; margin-top: 2px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    background: #eef3fb;
    color: #3565c0;
    border: 1px solid #d7e3f6;
  }
  .dooray-body { padding: 24px 32px 40px; }
  .toastui-editor-contents { font-size: 14px; }
  .toastui-editor-contents table { width: auto; }
  /* mermaid 가 그리기 전이나 CDN 을 받지 못했을 때 원문이 읽히게 둔다. */
  .toastui-editor-contents .mermaid { white-space: pre; margin: 12px 0; }
  .toastui-editor-contents .mermaid-done { white-space: normal; }
  .toastui-editor-contents .mermaid-error {
    white-space: normal;
    border: 1px solid #f1b5b5;
    background: #fff5f5;
    border-radius: 4px;
    padding: 8px 12px;
  }
  .toastui-editor-contents .mermaid-error-msg { color: #c0392b; font-size: 12px; margin-bottom: 6px; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
<div class="dooray-frame">
  {{HEAD_HTML}}
  <div class="dooray-body"><div id="viewer"></div></div>
</div>

<script type="text/plain" id="md">
{{MD_BODY}}
</script>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<!-- Dooray 는 ```mermaid 블록을 도표로 그린다. 두레이 내장 버전은 확인하지 못해 여기서 고정한다. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  const md = document.getElementById('md').textContent;
  toastui.Editor.factory({
    el: document.querySelector('#viewer'),
    viewer: true,
    initialValue: md,
    // mermaid 블록을 코드 블록 대신 원문을 담은 div 로 내보낸다. 나머지 블록은 기본 렌더를 쓴다.
    customHTMLRenderer: {
      codeBlock(node, context) {
        if ((node.info || '').trim().split(/\s+/)[0] !== 'mermaid') return context.origin();
        return [
          { type: 'openTag', tagName: 'div', classNames: ['mermaid'] },
          { type: 'text', content: node.literal },
          { type: 'closeTag', tagName: 'div' },
        ];
      },
    },
  });

  // viewer 는 생성자 안에서 동기로 렌더를 마치므로 이 시점에 .mermaid 가 모두 있다.
  // 블록마다 따로 parse 하고 render 해, 한 블록의 문법 오류가 다른 블록과 본문을 막지 않게 한다.
  (async function renderMermaid() {
    const blocks = document.querySelectorAll('#viewer .mermaid');
    if (!blocks.length || typeof mermaid === 'undefined') return;
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
    for (let i = 0; i < blocks.length; i++) {
      const el = blocks[i];
      const src = el.textContent;
      try {
        await mermaid.parse(src);
        const { svg } = await mermaid.render('mermaid-preview-' + i, src);
        el.innerHTML = svg;
        el.classList.add('mermaid-done');
      } catch (e) {
        el.classList.add('mermaid-error');
        el.textContent = '';
        const msg = document.createElement('div');
        msg.className = 'mermaid-error-msg';
        msg.textContent = 'mermaid 오류: ' + (e && e.message ? e.message : e);
        const pre = document.createElement('pre');
        pre.textContent = src;
        el.append(msg, pre);
      }
    }
  })();
</script>
</body>
</html>
