name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.309
      - name: Install npm dependencies
        # 테스트 실행기 단계는 plugin test 가 실패해도 돈다. 설치를 그 뒤에 두면 건너뛰어져 의존 없이 돈다
        run: npm ci --ignore-scripts
      - name: Run plugin tests from repository root
        run: claude plugin test .
      - name: Run repository test runner
        # 묶음 목록, TypeScript 버전, 캐시 폴더는 실행기가 소유한다(scripts/run-tests.ts 머리 주석).
        # plugin test 가 실패해도 돌려 같은 실행에서 두 결과를 함께 본다
        if: ${{ !cancelled() }}
        # 결과 폴더를 고정 경로로 둬 실패해도 아래 단계가 node.log 를 올릴 수 있게 한다
        run: node scripts/run-tests.ts --out "$RUNNER_TEMP/run-tests"
      - name: Upload test logs
        # 실패한 테스트의 상세 로그(node.log)가 job 이 끝나면 사라지지 않게 짧게 보관한다
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-tests-logs
          path: ${{ runner.temp }}/run-tests/node.log
          if-no-files-found: warn
          retention-days: 7
