name: ci-speed-experiment
# 임시 측정용이다. PR 전에 지운다.
on:
  push:
    branches: [perf/ci-test-speed]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - run: npm ci --ignore-scripts
      - name: machine
        run: |
          nproc; lscpu | grep -E 'Model name'
          sudo apt-get install -y -qq acct > /dev/null
      - name: run
        run: |
          cat > "$RUNNER_TEMP/cpu.mjs" <<'EOF'
          import { appendFileSync } from 'node:fs'
          import { relative } from 'node:path'
          process.on('exit', () => {
            const u = process.cpuUsage()
            const name = relative(process.cwd(), process.argv[1] ?? '-').replace(/^.*?(skills|scripts|modules|export-only-skills|tmp)\//, '$1/')
            try { appendFileSync(process.env.CPU_LOG, `${name}\t${((u.user + u.system) / 1000).toFixed(0)}\n`) } catch {}
          })
          EOF
          sudo touch /var/log/account/pacct || sudo mkdir -p /var/log/account
          sudo accton /var/log/account/pacct
          CPU_LOG="$RUNNER_TEMP/cpu.log" NODE_OPTIONS="--import=$RUNNER_TEMP/cpu.mjs" /usr/bin/time -v node scripts/run-tests.ts --out "$RUNNER_TEMP/run-tests" 2> "$RUNNER_TEMP/time.txt" || true
          sudo accton off
          tail -1 "$RUNNER_TEMP/run-tests/summary.txt"
          grep -E 'Elapsed|User time|System time' "$RUNNER_TEMP/time.txt"
          echo "== sa by command (calls, real, cpu)"
          sudo sa -a -c /var/log/account/pacct | head -25
          echo "== node scripts by cpu (count, total ms)"
          awk -F'\t' '{n[$1]++; s[$1]+=$2} END {for (k in n) printf "%d\t%d\t%s\n", n[k], s[k], k}' "$RUNNER_TEMP/cpu.log" | sort -t$'\t' -k2 -nr | head -40
          echo "== node total"
          awk -F'\t' '{c++; s+=$2} END {print c, s}' "$RUNNER_TEMP/cpu.log"
